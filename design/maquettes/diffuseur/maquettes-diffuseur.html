<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vupay — Maquettes diffuseur</title>
<style>
  :root {
    --encre: #1B1640; --primaire: #6C3BF5; --primaire-clair: #EEE8FF; --accent: #FFB020; --accent-clair: #FFF4DC;
    --fond: #F7F5FF; --carte: #FFFFFF; --bord: #E4DFF5; --doux: #6B6788; --succes: #14915F; --succes-clair: #E3F5EC;
    --erreur: #C8302B; --erreur-clair: #FBE7E6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; background: #E9E6F5; color: var(--encre); padding: 32px 16px; }
  header.planche { max-width: 1600px; margin: 0 auto 28px; }
  header.planche h1 { font-size: 26px; }
  header.planche p { color: var(--doux); margin-top: 6px; font-size: 14px; }
  .grille { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; max-width: 1600px; margin: 0 auto; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  figcaption { font-size: 14px; font-weight: 600; }
  figcaption span { display: block; font-weight: 400; color: var(--doux); font-size: 12px; text-align: center; }

  .tel { width: 360px; height: 760px; background: var(--fond); border-radius: 36px; border: 10px solid #15122B; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 12px 30px rgba(27,22,64,.18); }
  .statut { height: 28px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .contenu { flex: 1; overflow: hidden; padding: 4px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .barre { display: flex; align-items: center; gap: 10px; padding: 6px 18px 10px; flex-shrink: 0; }
  .barre h2 { font-size: 18px; }
  .retour { width: 32px; height: 32px; border-radius: 50%; background: var(--carte); display: grid; place-items: center; border: 1px solid var(--bord); font-size: 16px; }
  .nav { height: 64px; background: var(--carte); border-top: 1px solid var(--bord); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; }
  .nav div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--doux); }
  .nav div.actif { color: var(--primaire); font-weight: 600; }
  .nav svg { width: 22px; height: 22px; }

  .carte { background: var(--carte); border-radius: 16px; padding: 14px; border: 1px solid var(--bord); }
  .titre-section { font-size: 13px; font-weight: 600; color: var(--doux); text-transform: uppercase; letter-spacing: .04em; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 600; text-align: center; background: var(--primaire); color: #fff; }
  .btn.second { background: var(--carte); color: var(--primaire); border: 1.5px solid var(--primaire); }
  .btn.inactif { background: #CFC8EA; }
  .champ { background: var(--carte); border: 1.5px solid var(--bord); border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .champ.focus { border-color: var(--primaire); }
  .etiquette { font-size: 12px; color: var(--doux); margin-bottom: 6px; font-weight: 600; }
  .puce { display: inline-flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--carte); border: 1px solid var(--bord); color: var(--encre); }
  .puce.on { background: var(--primaire-clair); border-color: var(--primaire); color: var(--primaire); }
  .puces { display: flex; flex-wrap: wrap; gap: 6px; }
  .ligne { display: flex; justify-content: space-between; align-items: center; }
  .doux { color: var(--doux); font-size: 12px; }
  .gros { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .badge { white-space: nowrap; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .badge.ok { background: var(--succes-clair); color: var(--succes); }
  .badge.att { background: var(--accent-clair); color: #9A6400; }
  .badge.ko { background: var(--erreur-clair); color: var(--erreur); }
  .badge.violet { background: var(--primaire-clair); color: var(--primaire); }
  .reseau { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--primaire-clair); color: var(--primaire); flex-shrink: 0; }
  .logo { font-size: 30px; font-weight: 800; color: var(--primaire); letter-spacing: -.03em; }
  .logo b { color: var(--accent); }
  .sep { height: 1px; background: var(--bord); }
  .note { font-size: 12px; color: var(--doux); line-height: 1.45; }
  .alerte { border-radius: 12px; padding: 10px 12px; font-size: 12.5px; line-height: 1.4; }
  .alerte.info { background: var(--primaire-clair); color: #3D1FA8; }
  .alerte.att { background: var(--accent-clair); color: #7A4F00; }
  .alerte.ok { background: var(--succes-clair); color: #0D6B45; }
</style>
</head>
